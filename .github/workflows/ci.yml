name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contractor_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_ci
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # The test suite renders real PDFs (Arabic/French/English quotes and
        # invoices) via a headless browser — this is required for those
        # tests to run at all, not an optional extra.
        run: npx playwright install --with-deps chromium
        working-directory: server

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate --workspace server

      - name: Test (server)
        run: npm test --workspace server

      - name: Build
        run: npm run build
