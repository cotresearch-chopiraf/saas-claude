name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contractor_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_ci
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # The test suite renders real PDFs (Arabic/French/English quotes and
        # invoices) via a headless browser — this is required for those
        # tests to run at all, not an optional extra.
        run: npx playwright install --with-deps chromium
        working-directory: server

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate --workspace server

      - name: Test (server)
        run: npm test --workspace server

      - name: Test (client)
        # Slice Z — the client test suite (component/integration tests via
        # React Testing Library + jsdom) existed and passed locally but was
        # never actually executed in CI before this; it needs no database
        # or running server (every test mocks apiFetch directly), so no
        # extra env/service setup beyond what's already configured above.
        run: npm test --workspace client

      - name: Build
        run: npm run build

      - name: Build Docker image
        # AC-11 — validates the production Dockerfile actually builds from a
        # clean checkout (this runner has no local layer cache from a prior
        # run) on every push/PR, catching a broken Dockerfile before it ever
        # reaches a real deploy. Build-only: no registry login, no push, no
        # image publish — this repo has no existing publish convention to
        # match, and none is being introduced here. Never runs the
        # container or contacts real ZATCA/AWS/Resend — the multi-stage
        # build (npm ci, Playwright Chromium install, tsc build) needs none
        # of that, only network access to npm/Debian package mirrors, which
        # this runner already has for the steps above.
        run: docker build -t midad-server:ci .
